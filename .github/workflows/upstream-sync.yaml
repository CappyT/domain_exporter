# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: upstream-sync

on:
  schedule:
    # every monday at 04:17 UTC
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/caarlos0/domain_exporter.git
  UPSTREAM_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The `merge=ours` attributes in .gitattributes are inert unless this
          # driver is defined - "ours" is NOT one of git's builtin drivers
          # (only text/binary/union are). `true` exits 0 without touching %A,
          # which git pre-populates with our version, so our side wins.
          #
          # CAVEAT, on purpose: upstream's improvements to the fork-owned CI
          # files (.github/workflows/{build,lint,goreleaser,docker}.yml,
          # .goreleaser.yml, renovate.json) are silently DROPPED on every sync.
          # This fork owns them - they run OSS goreleaser, push to our ghcr
          # namespace and use floating action majors - and Renovate keeps them
          # fresh, so upstream's SHA bumps there are noise, not value.
          # Everything else (source, docs, go.mod) merges normally and a real
          # conflict still fails this job loudly for a human to resolve.
          git config merge.ours.driver true

      - name: Merge upstream
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream "$UPSTREAM_BRANCH"
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "already up to date with upstream/$UPSTREAM_BRANCH"
            echo "changed=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! git merge --no-edit "upstream/$UPSTREAM_BRANCH"; then
            echo "::error::merge conflict against upstream/$UPSTREAM_BRANCH - resolve it manually, never auto-resolve"
            git diff --name-only --diff-filter=U | sed 's/^/conflict: /'
            git merge --abort || true
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_ENV"

      - name: Push
        if: env.changed == 'true'
        run: git push origin HEAD:main
