# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# Fork-local, GoReleaser OSS config. Upstream ships a goreleaser-pro config
# (remote `includes`, gemfury, twitter, caarlos0's Docker Hub) that cannot run
# here: it needs a GORELEASER_KEY and secrets this fork does not have.
# Container images are built and pushed by .github/workflows/docker.yml.
version: 2

project_name: domain_exporter

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore"
      - "^ci"

release:
  prerelease: auto
